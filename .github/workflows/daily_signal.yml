name: Daily Core Signal

# 매일 한국시간 06:30(월~토)에 신호를 계산해 텔레그램으로 발송합니다.
#   KST 06:30 = UTC 전날 21:30  ->  cron 요일 0~5 (일~금, UTC) = 한국시간 월~토
# GitHub의 스케줄 실행은 혼잡 시간대에 수 분~수십 분 늦어질 수 있습니다.
on:
  schedule:
    - cron: '30 21 * * 0-5'
  workflow_dispatch:             # Actions 탭의 "Run workflow" 버튼(수동 테스트용)
    inputs:
      force:
        description: '일요일에도 강제 실행 (테스트용)'
        type: boolean
        default: false

jobs:
  send-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_RUN: ${{ inputs.force && '1' || '' }}
        run: python core_signals.py
